name: LOSv3 - Ejecucion y Validacion Critica

on:
  push:
    branches: [ carlin-maker ]

jobs:
  LOSv3_Execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalacion y Compilacion
        run: |
          npm install
          npx hardhat compile

      - name: Testeo de Integridad (LOSv3)
        run: npx hardhat test --network localhost

      - name: Validacion y Cierre (Vampirio & Shadow)
        env:
          SIGNATURE_KEY: ${{ secrets.SIGNATURE_KEY }}
        run: |
          # Activacion del Protocolo Vampirio y Shadow Relayer
          npx hardhat run scripts/v3-operational-sync.js
          echo "LOSv3: Ecosistema Operativo bajo proteccion."
